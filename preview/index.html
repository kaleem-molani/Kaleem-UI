    <meta name="description" content="Kaleem UI M0 Design Preview: Evergreen & Mint design system foundations, accessible primitives, and application patterns." />
    
    <!-- Clean up any stale service workers or caches from previous apps on localhost ports -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Direct CSS entry points for guaranteed instant styling -->
    <link rel="stylesheet" href="/src/index.css?direct" />
    <link rel="stylesheet" href="/src/App.css?direct" />

    <title>Kaleem UI --- M0 Design Preview</title>
  </head>

  </body>
